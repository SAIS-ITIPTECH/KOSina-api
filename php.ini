; Extensions
extension=pdo
extension=pdo_mysql

; Error handling (use 'production' settings on Railway)
display_errors=Off
log_errors=On
error_reporting=E_ALL

; Timezone
date.timezone=Asia/Manila

; Upload limits (adjust as needed)
upload_max_filesize=20M
post_max_size=20M

; Memory
memory_limit=256M

; Max execution time (seconds)
max_execution_time=30